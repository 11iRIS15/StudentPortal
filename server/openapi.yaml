openapi: 3.0.3

info:
  title: StudenPortal API
  version: 1.0.0
  description: Student portal API using mock data.

servers:
  - url: http://localhost:8000/api/v1

paths:
  /health:
    get:
      summary: Check API health
      responses:
        "200":
          description: API is running

  /students/{studentId}/profile:
    get:
      summary: Get student profile
      parameters: &studentIdParam
        - name: studentId
          in: path
          required: true
          schema:
            type: string
          example: "2026-00001"
      responses:
        "200":
          description: Student profile
        "404":
          description: Student not found

  /students/{studentId}/dashboard:
    get:
      summary: Get student dashboard
      parameters: *studentIdParam
      responses:
        "200":
          description: Dashboard information

  /students/{studentId}/subjects:
    get:
      summary: Get student subjects
      parameters: *studentIdParam
      responses:
        "200":
          description: Student subjects

  /students/{studentId}/enrollment:
    get:
      summary: Get student enrollment
      parameters: *studentIdParam
      responses:
        "200":
          description: Enrollment information

  /students/{studentId}/schedule:
    get:
      summary: Get student schedule
      parameters: *studentIdParam
      responses:
        "200":
          description: Class schedule

  /students/{studentId}/grades:
    get:
      summary: Get student grades
      parameters: *studentIdParam
      responses:
        "200":
          description: Student grades

  /students/{studentId}/finance:
    get:
      summary: Get student finance
      parameters: *studentIdParam
      responses:
        "200":
          description: Financial information

  /students/{studentId}/library:
    get:
      summary: Get student library records
      parameters: *studentIdParam
      responses:
        "200":
          description: Library records

  /students/{studentId}/clinic:
    get:
      summary: Get student clinic records
      parameters: *studentIdParam
      responses:
        "200":
          description: Clinic records

  /announcements:
    get:
      summary: Get all announcements
      responses:
        "200":
          description: List of announcements

  /announcements/{id}:
    get:
      summary: Get announcement by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Announcement details
        "404":
          description: Announcement not found